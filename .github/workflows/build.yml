name: Build APK

on:
  push:
    # ⚠️ 必须用 ['**'] 覆盖所有分支。
    # 写成 [main, master, 'feature/**'] 的话，fix/xxx 分支会静默不跑，
    # 且 Actions 列表里查不到记录，极易被误读成「已编译通过」（踩坑清单 2.1）
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# ⚠️ 关键：GitHub 新仓库的 GITHUB_TOKEN 默认是**只读**的。
# 不显式声明的话，失败时回传日志的 git push 会被拒绝，
# 而 continue-on-error 会让这一步仍然显示 success —— 静默失效。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库内不含 gradle-wrapper.jar，由本 action 直接安装指定版本。
      # AGP 9.4.0 要求 Gradle >= 9.6.0。
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: 编译 Debug APK
        id: build_debug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 上传 Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dayscounter-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Release 构建会跑 lintVital，debug 不跑。
      # Lint 问题会潜伏到出正式包时才炸，所以早期就跑一次（踩坑清单 2.3）
      - name: 编译 Release APK
        id: build_release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: 上传 Release APK
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: dayscounter-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # 沙盒访问 CI 日志可能被网络策略拦截（403）。
      # 失败时把日志 commit 回仓库，再从 Contents API 读取（踩坑清单 2.5）
      # 沙盒访问 CI 日志会被网络策略拦截（403，踩坑清单 5.2）。
      # 变通：失败时把日志 commit 回仓库，再从 Contents API 读取。
      # ⚠️ 必须用 git add -f：ci-logs 若被 .gitignore 忽略，
      #    git add 无内容 → commit 失败 → push 不执行 → 本步骤仍显示 success（静默失效）
      - name: 回传编译日志（临时）
        if: failure()
        continue-on-error: true
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          gradle assembleDebug --stacktrace --no-daemon > ci-logs/build-${{ github.run_number }}.txt 2>&1
          echo "=== 最后 200 行 ===" > ci-logs/tail-${{ github.run_number }}.txt
          tail -n 200 ci-logs/build-${{ github.run_number }}.txt >> ci-logs/tail-${{ github.run_number }}.txt
          echo "=== 错误行 ===" >> ci-logs/tail-${{ github.run_number }}.txt
          grep -E "^e: |^w: |FAILED|error:|What went wrong" ci-logs/build-${{ github.run_number }}.txt | head -60 >> ci-logs/tail-${{ github.run_number }}.txt || true
          git add -f ci-logs
          git commit -q -m "ci: 编译日志 run-${{ github.run_number }}"
          git push -q origin "HEAD:${{ github.ref_name }}"
          echo "日志回传退出码: $?"

      - name: 判定失败
        if: failure()
        run: exit 1
